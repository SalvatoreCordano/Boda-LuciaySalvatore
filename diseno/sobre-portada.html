<title>Sobre Lucía y Salvatore</title>
<style>
  :root{
    --cream:#f1ead8;
    --cream-deep:#e3dabf;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    background:var(--cream);
  }
  .frame{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--cream);
  }
  /* fondo: papel crema con grano sutil, sin fotos externas */
  .paper{
    position:absolute;
    inset:0;
  }
  .paper::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 120% 90% at 50% 45%, var(--cream) 0%, var(--cream) 55%, var(--cream-deep) 100%);
  }
  .paper::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.5;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch' result='t'/><feColorMatrix in='t' type='matrix' values='0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.72  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* --- escena 1: sobre cerrado --- */
  #envelopeScene{
    transition:opacity .45s ease;
  }
  #envelopeScene.is-hidden{
    opacity:0;
    pointer-events:none;
  }

  .envelope{
    position:relative;
    width:62%;
    max-width:520px;
  }
  .envelope img{
    display:block;
    width:100%;
    height:auto;
  }

  .seal{
    position:absolute;
    left:50%;
    top:71.3%;
    width:22.4%;
    transform:translate(-50%,-50%);
    padding:0;
    border:0;
    background:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .2s ease, filter .2s ease;
  }
  .seal:hover,
  .seal:focus-visible{
    transform:translate(-50%,-50%) scale(1.06);
    filter:drop-shadow(0 3px 8px rgba(92,70,20,0.35));
  }
  .seal:focus-visible{
    outline:2px solid #71755d;
    outline-offset:4px;
    border-radius:50%;
  }
  .seal img{
    display:block;
    width:100%;
    height:auto;
  }

  /* --- escena 2: sobre abierto / invitación --- */
  #letterScene{
    opacity:0;
  }
  #letterScene.is-visible{
    animation:revealLetter .7s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes revealLetter{
    from{ opacity:0; transform:translateY(-18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    #envelopeScene{ transition:opacity .3s linear; }
    #letterScene.is-visible{ animation:fadeOnly .3s linear forwards; }
    @keyframes fadeOnly{ from{opacity:0;} to{opacity:1;} }
  }

  .letter-img{
    display:block;
    width:auto;
    height:auto;
    max-width:78%;
    max-height:88%;
  }

  .credit{
    position:absolute;
    left:0;
    right:0;
    bottom:max(24px, env(safe-area-inset-bottom, 0px) + 12px);
    text-align:center;
    font:italic 13px/1.4 Georgia, serif;
    color:#71755d;
    letter-spacing:0.02em;
    pointer-events:none;
  }
</style>

<div class="frame">
  <div class="paper"></div>

  <div class="scene" id="envelopeScene">
    <div class="envelope">
      <img src="sobre-cerrado.png" alt="Sobre cerrado" />
      <button class="seal" id="sealBtn" type="button" aria-label="Abrir la invitación">
        <img src="sello-lacre.png" alt="" />
      </button>
    </div>
  </div>

  <div class="scene" id="letterScene" hidden>
    <img class="letter-img" src="sobre-abierto.png" alt="Invitación con el sobre abierto" />
  </div>

  <p class="credit">Lucía &amp; Salvatore — 28 de noviembre, 2026</p>
</div>

<script>
  (function(){
    var sealBtn = document.getElementById('sealBtn');
    var envelopeScene = document.getElementById('envelopeScene');
    var letterScene = document.getElementById('letterScene');
    var opened = false;

    sealBtn.addEventListener('click', function(){
      if(opened) return;
      opened = true;

      envelopeScene.classList.add('is-hidden');

      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var delay = reduced ? 250 : 400;

      setTimeout(function(){
        envelopeScene.hidden = true;
        letterScene.hidden = false;
        // fuerza reflow antes de animar para que la transición se dispare
        void letterScene.offsetWidth;
        letterScene.classList.add('is-visible');
      }, delay);
    });
  })();
</script>
