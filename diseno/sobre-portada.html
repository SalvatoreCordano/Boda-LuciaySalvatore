<title>Sobre Lucía y Salvatore</title>
<style>
  :root{
    --cream:#f1ead8;
    --cream-deep:#e3dabf;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    background:var(--cream);
  }
  .frame{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--cream);
  }
  /* fondo: papel crema con grano sutil, sin fotos externas */
  .paper{
    position:absolute;
    inset:0;
  }
  .paper::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 120% 90% at 50% 45%, var(--cream) 0%, var(--cream) 55%, var(--cream-deep) 100%);
  }
  .paper::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.5;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch' result='t'/><feColorMatrix in='t' type='matrix' values='0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.72  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* el sobre real, con el sello real superpuesto en la punta de la solapa */
  .envelope{
    position:relative;
    width:62%;
    max-width:520px;
  }
  .envelope img{
    display:block;
    width:100%;
    height:auto;
  }
  .seal{
    position:absolute;
    left:50%;
    top:71.3%;
    width:22.4%;
    transform:translate(-50%,-50%);
  }
  .seal img{
    display:block;
    width:100%;
    height:auto;
  }

  .credit{
    position:absolute;
    left:0;
    right:0;
    bottom:max(24px, env(safe-area-inset-bottom, 0px) + 12px);
    text-align:center;
    font:italic 13px/1.4 Georgia, serif;
    color:#71755d;
    letter-spacing:0.02em;
  }
</style>

<div class="frame">
  <div class="paper"></div>
  <div class="scene">
    <div class="envelope">
      <img src="sobre-cerrado.png" alt="Sobre cerrado" />
      <div class="seal">
        <img src="sello-lacre.png" alt="Sello de lacre" />
      </div>
    </div>
  </div>
  <p class="credit">Lucía &amp; Salvatore — 28 de noviembre, 2026</p>
</div>
