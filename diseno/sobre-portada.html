<title>Sobre Lucía & Salvatore</title>
<style>
  :root{
    --cream:#f1ead8;
    --cream-deep:#e9e0c9;
    --tan:#cec4a0;
    --tan-deep:#b7ab80;
    --sage:#8a8e75;
    --sage-deep:#71755d;
    --sage-light:#bec5a4;
    --ink:#5c5c46;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-block:48px;
  }
  .stage{
    width:100%;
    max-width:920px;
    padding-inline:16px;
  }
  .frame{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    max-height:88vh;
    margin:0 auto;
    border-radius:2px;
    overflow:hidden;
    background:var(--cream);
    box-shadow:0 1px 3px rgba(92,92,70,0.08);
  }
  /* paper grain, layered radial vignette + fine noise */
  .paper{
    position:absolute;
    inset:0;
  }
  .paper::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 45%, var(--cream) 0%, var(--cream) 55%, var(--cream-deep) 100%);
  }
  .paper::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.5;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch' result='t'/><feColorMatrix in='t' type='matrix' values='0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.72  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .envelope-wrap{
    position:relative;
    width:62%;
    max-width:520px;
  }
  .envelope-wrap svg{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 18px 34px rgba(92,92,70,0.22));
  }

  .seal{
    position:absolute;
    left:50%;
    top:58.5%;
    width:15%;
    max-width:118px;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 8px 14px rgba(92,92,70,0.28));
  }
  .seal svg{ display:block; width:100%; height:auto; }

  .credit{
    text-align:center;
    margin-top:18px;
    font:italic 13px/1.4 Georgia, serif;
    color:var(--sage-deep);
    letter-spacing:0.02em;
  }
</style>

<div class="stage">
  <div class="frame">
    <div class="paper"></div>

    <div class="scene">
      <div class="envelope-wrap">
        <!-- Envelope back, scalloped flap + seam lines -->
        <svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="envFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#93976f"/>
              <stop offset="1" stop-color="#7e825f"/>
            </linearGradient>
            <linearGradient id="envShadeL" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#000000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
            </linearGradient>
            <linearGradient id="envShadeR" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
            </linearGradient>
          </defs>

          <!-- envelope body -->
          <rect x="14" y="14" width="572" height="432" rx="10" fill="url(#envFill)"/>

          <!-- scalloped flap silhouette (top edge dipping to a point at center) -->
          <path d="M14,24
                   C14,18 18,14 24,14
                   L576,14
                   C582,14 586,18 586,24
                   L586,150
                   C 520,150 500,95 460,95
                   C 420,95 415,150 360,150
                   C 320,150 315,60 300,60
                   C 285,60 280,150 240,150
                   C 185,150 180,95 140,95
                   C 100,95 80,150 14,150
                   Z" fill="#000000" opacity="0.05"/>

          <!-- flap V seam, from top corners down to center point -->
          <path d="M20,16 L300,225 L580,16" fill="none" stroke="#000000" stroke-opacity="0.16" stroke-width="2"/>
          <path d="M20,16 L300,225 L580,16" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" transform="translate(0,2)"/>

          <!-- lower seam lines, from bottom corners up to a center apex -->
          <path d="M20,444 L300,320 L580,444" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="2"/>
          <path d="M20,444 L300,320 L580,444" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" transform="translate(0,-2)"/>

          <!-- soft corner shading for depth -->
          <path d="M14,24 C14,18 18,14 24,14 L 300,14 L20,16 Z" fill="url(#envShadeL)"/>
          <path d="M586,24 C586,18 582,14 576,14 L 300,14 L580,16 Z" fill="url(#envShadeR)"/>

          <!-- rounded corners mask edge highlight -->
          <rect x="14" y="14" width="572" height="432" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

          <!-- monogram -->
          <g transform="translate(300,110)" text-anchor="middle" fill="none">
            <text x="-30" y="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58"
                  fill="#000000" fill-opacity="0.16">S</text>
            <text x="-30" y="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58"
                  fill="#fdfaf0" fill-opacity="0.30" transform="translate(-1,-1)">S</text>
            <text x="26" y="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58"
                  fill="#000000" fill-opacity="0.16">L</text>
            <text x="26" y="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58"
                  fill="#fdfaf0" fill-opacity="0.30" transform="translate(-1,-1)">L</text>
          </g>
        </svg>
      </div>

      <!-- wax seal -->
      <div class="seal">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sealFill" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#ded2a4"/>
              <stop offset="0.6" stop-color="#cec4a0"/>
              <stop offset="1" stop-color="#a99d76"/>
            </radialGradient>
            <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#5c5836" flood-opacity="0.35"/>
            </filter>
          </defs>

          <!-- irregular wax blob edge -->
          <path d="M100,10
                   C 130,8 150,20 158,42
                   C 168,58 192,66 192,96
                   C 194,122 176,132 170,152
                   C 164,176 140,192 108,190
                   C 80,192 56,182 42,162
                   C 24,148 8,132 10,104
                   C 6,78 22,58 38,44
                   C 52,22 76,12 100,10 Z"
                fill="url(#sealFill)"/>
          <path d="M100,10
                   C 130,8 150,20 158,42
                   C 168,58 192,66 192,96
                   C 194,122 176,132 170,152
                   C 164,176 140,192 108,190
                   C 80,192 56,182 42,162
                   C 24,148 8,132 10,104
                   C 6,78 22,58 38,44
                   C 52,22 76,12 100,10 Z"
                fill="none" stroke="#7e7554" stroke-opacity="0.25" stroke-width="2"/>

          <!-- inner rim -->
          <circle cx="100" cy="100" r="66" fill="none" stroke="#7e7554" stroke-opacity="0.30" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="70" fill="none" stroke="#fdfaf0" stroke-opacity="0.35" stroke-width="1"/>

          <!-- floral emboss: stem, leaves, blossom -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M100,138 C100,118 96,104 100,84" stroke="#5c5836" stroke-opacity="0.45" stroke-width="3"/>
            <path d="M100,138 C100,118 96,104 100,84" stroke="#fdfaf0" stroke-opacity="0.30" stroke-width="1.2" transform="translate(-0.8,-0.8)"/>

            <path d="M100,120 C 86,116 78,124 74,134" stroke="#5c5836" stroke-opacity="0.42" stroke-width="2.4"/>
            <path d="M100,120 C 86,116 78,124 74,134" stroke="#fdfaf0" stroke-opacity="0.28" stroke-width="1" transform="translate(-0.6,-0.6)"/>

            <path d="M100,128 C 114,125 122,133 126,142" stroke="#5c5836" stroke-opacity="0.42" stroke-width="2.4"/>
            <path d="M100,128 C 114,125 122,133 126,142" stroke="#fdfaf0" stroke-opacity="0.28" stroke-width="1" transform="translate(-0.6,-0.6)"/>

            <g stroke="#5c5836" stroke-opacity="0.45" stroke-width="2.2">
              <circle cx="100" cy="72" r="9"/>
              <path d="M100,63 C 92,56 84,58 82,66 C 80,74 88,78 96,74"/>
              <path d="M100,63 C 108,56 116,58 118,66 C 120,74 112,78 104,74"/>
              <path d="M91,72 C 86,68 82,70 82,76 C 82,82 88,84 92,80"/>
              <path d="M109,72 C 114,68 118,70 118,76 C 118,82 112,84 108,80"/>
            </g>
            <g stroke="#fdfaf0" stroke-opacity="0.25" stroke-width="1" transform="translate(-0.7,-0.7)">
              <circle cx="100" cy="72" r="9"/>
              <path d="M100,63 C 92,56 84,58 82,66 C 80,74 88,78 96,74"/>
              <path d="M100,63 C 108,56 116,58 118,66 C 120,74 112,78 104,74"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <p class="credit">Lucía &amp; Salvatore — 28 de noviembre, 2026</p>
</div>
