<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sobre Lucía y Salvatore</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=3" />
<link rel="stylesheet" href="css/envelope.css?v=7" />
</head>
<body>

<div class="frame">
  <div class="paper"></div>

  <div class="scene" id="envelopeScene">
    <div class="canvas">
      <div class="envelope">
        <img src="assets/sobre-cerrado.webp" alt="Sobre cerrado" />
        <button class="seal" id="sealBtn" type="button" aria-label="Abrir la invitación">
          <img src="assets/sello-lacre.webp" alt="" />
        </button>
      </div>
    </div>
  </div>

  <div class="scene" id="letterScene" hidden>
    <div class="canvas">
      <img class="card card--sobre" id="cardSobre" src="assets/sobre-abierto.webp" alt="Sobre abierto" />
      <img class="card card--grupo-1" id="cardGrupo1" src="assets/grupo-1.webp" alt="Lucía y Salvatore" />
      <img class="card card--grupo-2" id="cardGrupo2" src="assets/grupo-2.webp" alt="Lucía y Salvatore" />
      <img class="card card--recepcion" id="cardRegalos" src="assets/regalos-completa.webp" alt="Tarjeta de mesa de regalos" />
      <img class="card card--regalos" id="cardRecepcion" src="assets/recepcion-completa.webp" alt="Tarjeta de recepción" />
      <img class="card card--invitacion" id="cardInvitacion" src="assets/invitacion-completa.webp" alt="Tarjeta de invitación con los nombres" />
    </div>
  </div>

  <div class="bottom-stack">
    <a class="more-link" id="moreLink" href="/invitacion/">Ver invitación</a>
  </div>
</div>

<div class="code-modal" id="codeModal" hidden>
  <div class="code-modal-box">
    <p class="code-modal-title">Ingresa tu código de invitación</p>
    <p class="code-modal-hint">Lo encuentras en el mensaje o tarjeta que te enviamos.</p>
    <form id="codeForm">
      <input type="text" id="codeInput" class="code-modal-input" placeholder="Ej. 123456" inputmode="numeric" autocomplete="off" />
      <p class="code-modal-error" id="codeError" hidden>Código incorrecto. Verifica e intenta de nuevo.</p>
      <button type="submit" class="code-modal-submit">Continuar</button>
    </form>
  </div>
</div>

<div class="music-player" id="musicPlayer">
  <audio id="bgMusic" src="/assets/musica.mp3" loop preload="none"></audio>
  <button class="music-btn" id="musicVolDown" type="button" aria-label="Bajar volumen">−</button>
  <button class="music-btn music-toggle" id="musicToggle" type="button" aria-label="Reproducir música">
    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <button class="music-btn" id="musicVolUp" type="button" aria-label="Subir volumen">+</button>
</div>

<script src="js/envelope.js?v=6"></script>
<script src="/js/music-player.js?v=2"></script>

</body>
</html>
